apiVersion: v1
kind: Service
metadata:
  name: car-serv-backend-svc
  namespace: app
  labels:
    app.kubernetes.io/name: car-serv-backend
    tier: app-tier
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: car-serv-backend
  ports:
    - name: http
      port: 5000
      targetPort: 5000
      protocol: TCP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: car-serv-backend-hpa
  namespace: app
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: car-serv-backend
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 80
