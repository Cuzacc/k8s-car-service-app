pid /tmp/nginx.pid;
worker_processes auto;

events {
    worker_connections 2048;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp_path;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    # Enterprise Distributed Tracing Log Format
    log_format json_analytics escape=json '{'
        '"timestamp":"$time_iso8601",'
        '"request_id":"$request_id",'
        '"remote_addr":"$remote_addr",'
        '"request_method":"$request_method",'
        '"request_uri":"$request_uri",'
        '"status": $status,'
        '"body_bytes_sent": $body_bytes_sent,'
        '"request_time": $request_time,'
        '"http_referrer":"$http_referer",'
        '"http_user_agent":"$http_user_agent"'
    '}';

    access_log /var/log/nginx/access.log json_analytics;
    error_log  /var/log/nginx/error.log warn;

    sendfile        on;
    keepalive_timeout 65;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    # Upstream Backend API Service (Kubernetes Internal ClusterIP DNS)
    upstream backend_api {
        server car-serv-backend-svc:5000 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    server {
        listen 8080;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        add_header X-Request-ID $request_id always;

        # Frontend Static UI
        location / {
            try_files $uri $uri/ =404;
        }

        # Reverse Proxy to Tier 2 Backend API
        location /api/ {
            proxy_pass http://backend_api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Request-ID $request_id;
            proxy_connect_timeout 5s;
            proxy_read_timeout 10s;
        }

        # Kubernetes Health Check Probe
        location = /healthz {
            access_log off;
            default_type application/json;
            return 200 '{"status":"healthy","tier":"Tier-1-Frontend"}';
        }

        error_page 404 /404.html;
        location = /404.html {
            internal;
            default_type text/html;
            return 404 '<!DOCTYPE html><html><head><title>404 Not Found</title><style>body{background:#0f172a;color:#fff;text-align:center;padding-top:100px;}</style></head><body><h1>404 Not Found</h1><p>The requested endpoint does not exist on this cluster node.</p><a href="/" style="color:#38bdf8;">Return Home</a></body></html>';
        }
    }
}
